<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letter Writer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; background: #e8e8e8; color: #222; }
    #panel { width: 340px; min-width: 340px; padding: 14px; overflow-y: auto; background: #fafafa; border-right: 1px solid #ccc; }
    #panel h1 { font-size: 18px; margin: 0 0 10px; }
    textarea { width: 100%; height: 200px; font-family: monospace; font-size: 13px; resize: vertical; }
    label { display: block; font-size: 12px; margin-top: 10px; }
    select, input[type=number] { width: 100%; padding: 3px; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    input[type=range] { width: 100%; }
    button { margin-top: 14px; width: 100%; padding: 8px; font-size: 14px; cursor: pointer; }
    #status { font-size: 12px; color: #b00; margin-top: 8px; min-height: 1em; }
    #stage { flex: 1; overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
    #stage canvas { max-width: 100%; height: auto !important; box-shadow: 0 2px 10px rgba(0,0,0,.3); background: #fff; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Letter Writer</h1>
    <textarea id="text" placeholder="Paste markdown or plain text. *Italics* are supported.">Dear friend,

This is a *test* letter for the pen plotter. Only _italic_ text is styled; everything else is plain.

Sincerely,
Me</textarea>

    <label>Single-stroke font
      <select id="font"></select>
    </label>

    <div class="row">
      <div><label>Font size (pt)<input type="number" id="fontSize" value="14" min="1" step="0.5"></label></div>
      <div><label>Line height (×)<input type="number" id="lineHeight" value="1.5" min="0.5" step="0.05"></label></div>
    </div>
    <div class="row">
      <div><label>Padding top/bottom (in)<input type="number" id="padV" value="1" min="0" step="0.125"></label></div>
      <div><label>Padding left/right (in)<input type="number" id="padH" value="1" min="0" step="0.125"></label></div>
    </div>
    <div class="row">
      <div><label>Doc width (in)<input type="number" id="docW" value="8.5" min="1" step="0.1"></label></div>
      <div><label>Doc height (in)<input type="number" id="docH" value="11" min="1" step="0.1"></label></div>
    </div>
    <label>DPI: <span id="dpiVal">96</span>
      <input type="range" id="dpi" min="24" max="300" step="1" value="96">
    </label>

    <button id="save">Save SVG (rotated 90° for plotter)</button>
    <div id="status"></div>
  </div>
  <div id="stage"><div id="canvasHolder"></div></div>

  <script src="p5.js"></script>
  <script src="p5.plotSvg.js"></script>
  <script src="SvgFont.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
